{% extends 'base/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card shadow p-4">
    <h3 class="mb-3">{{ title }}</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{{ btn }}</button>
    </form>
</div>
{% endblock %}
